<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Voice Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #00d2ff; }
        .select-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #151522;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button.recording {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        .output-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            border: 1px solid #333;
        }
        .output-box p { margin: 5px 0; }
        .label-text { color: #00d2ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Live Voice Translator</h2>
        
        <div class="select-group">
            <label for="sourceLang">Bolne ki Zaban (Source Language):</label>
            <select id="sourceLang">
                <option value="en-US">English (US)</option>
                <option value="ur-PK">Urdu (Pakistan)</option>
                <option value="hi-IN">Hindi</option>
                <option value="ar-SA">Arabic</option>
                <option value="es-ES">Spanish</option>
            </select>
        </div>

        <div class="select-group">
            <label for="targetLang">Translate karne ki Zaban (Target Language):</label>
            <select id="targetLang">
                <option value="ur">Urdu</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ar">Arabic</option>
                <option value="es">Spanish</option>
            </select>
        </div>

        <button id="startBtn" onclick="toggleListening()">Mic On Karein (Start)</button>

        <div class="output-box">
            <p><span class="label-text">Aapne kaha:</span> <span id="originalText">...</span></p>
            <p><span class="label-text">Translated:</span> <span id="translatedText">...</span></p>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const originalTextElem = document.getElementById('originalText');
        const translatedTextElem = document.getElementById('translatedText');
        const sourceLangSelect = document.getElementById('sourceLang');
        const targetLangSelect = document.getElementById('targetLang');

        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                startBtn.textContent = "Sun raha hoon... (Listening)";
                startBtn.classList.add('recording');
            };

            recognition.onresult = async (event) => {
                const speechToText = event.results[0][0].transcript;
                originalTextElem.textContent = speechToText;

                // Free translation API (MyMemory translation API)
                const sourceLang = sourceLangSelect.value.split('-')[0];
                const targetLang = targetLangSelect.value;
                
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(speechToText)}&langpair=${sourceLang}|${targetLang}`);
                    const data = await response.json();
                    const translated = data.responseData.translatedText;
                    
                    translatedTextElem.textContent = translated;
                    speakText(translated, targetLang);
                } catch (error) {
                    translatedTextElem.textContent = "Translation Error!";
                }
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            alert("Aapka browser Speech Recognition ko support nahi karta. Chrome use karein.");
        }

        function toggleListening() {
            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                recognition.lang = sourceLangSelect.value;
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            startBtn.textContent = "Mic On Karein (Start)";
            startBtn.classList.remove('recording');
        }

        function speakText(text, lang) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
